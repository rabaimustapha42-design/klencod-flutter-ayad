name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ننشئ هيكل أندرويد (Gradle / Manifest) تلقائياً ثم ننسخ ملفاتنا فوقه
      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.abdou.teacher --project-name teacher_app app_build
          rm -rf app_build/lib app_build/assets
          cp -r lib app_build/lib
          cp -r assets app_build/assets
          cp pubspec.yaml app_build/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="تطبيق الأستاذ"/' app_build/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: app_build
        run: flutter pub get

      - name: Build APK
        working-directory: app_build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: teacher-app-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
